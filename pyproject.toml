[project]
name = "avengers-bank"
version = "0.1.0"
description = "AvengersBank 비동기 FastAPI 백엔드"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "pwdlib[argon2]>=0.3.1,<1",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "lightgbm>=4.5,<5",
    "langgraph>=0.6",
    "langchain-google-genai>=2.1",
    "cryptography>=44",
    "mcp>=1.10",
    "langchain-mcp-adapters>=0.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]
fds = [
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scikit-learn>=1.5,<2",
    "shap>=0.47,<1",
]
voice = [
    "speechbrain>=1.0",
    "torch>=2.6",
    "torchaudio>=2.6",
]

[tool.uv.build-backend]
module-name = "avengers_bank"

[tool.fastapi]
entrypoint = "avengers_bank.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
