# 품질 검사: 백엔드 테스트, 프론트 타입·린트·빌드, E2E(Playwright)
# - PR과 feature/backend-api 밖의 브랜치 push: 검사만 한다
# - feature/backend-api push: deploy.yml이 이 워크플로를 먼저 부르고(workflow_call), 다 통과해야 배포한다
name: ci

on:
  push:
    branches-ignore: [feature/backend-api]   # 이 브랜치는 deploy.yml이 검사 + 배포를 같이 돌린다
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 브랜치·PR에 새 push가 오면 이전 검사를 멈춘다 (deploy.yml에서 불리면 이름이 deploy로 잡혀 따로 묶인다)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: 백엔드 테스트 (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # 테스트는 SQLite(aiosqlite)로 돌아서 PostgreSQL이 필요 없다 (tests/conftest.py)
      - name: 의존성 (dev 그룹 포함)
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

  frontend:
    name: 프론트 검사 (tsc · oxlint · build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: 타입 검사
        run: npx tsc -b
      - name: 린트 (oxlint)
        run: npm run lint
      - name: 빌드
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: 백엔드 의존성
        working-directory: .
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium

      # playwright.config.ts가 SQLite 백엔드(시연 데이터)와 Vite를 띄운다. 외부 서비스(Gemini·ClearingHub)는 끈다
      - name: E2E
        run: npx playwright test

      - name: 실패 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
